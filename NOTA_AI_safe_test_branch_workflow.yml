name: NOTA AI failover — safe test branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nota-ai-failover-staging
  cancel-in-progress: false

jobs:
  prepare-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main (no application deployment)
        uses: actions/checkout@11bd71901bbe5b1630ceea73f0b37c7ffade55 # v4.2.2
        with:
          ref: main
          persist-credentials: true # needed only to push new test branch

      - name: Ensure expected source files exist
        run: |
          set -eu
          test -f app.py
          test -f nota_ai_render_failover_patch.py
          test -f test_nota_ai_render_failover.py
          python3 -c 'import ast; ast.parse(open("app.py", encoding="utf-8").read())'

      - name: Create isolated branch and apply patch
        run: |
          set -eu
          branch=fix/nota-ai-failover-20261118
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo 'STOP: test branch already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          git switch -c "$branch"
          python3 nota_ai_render_failover_patch.py app.py
          python3 -m py_compile app.py
          git diff --check
          git diff --stat

      - name: Run offline failover tests (no API calls or charges)
        run: |
          set -eu
          python3 -m unittest -v test_nota_ai_render_failover.py

      - name: Commit ONLY app.py to test branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.py
          git diff --cached --quiet && { echo 'STOP: no app.py changes'; exit 1; }
          git commit -m 'test: add sequential Gemini OpenRouter Groq OMR failover'
          git push --set-upstream origin fix/nota-ai-failover-20261118

      - name: Report staging comparison link
        run: |
          echo 'Test branch created; main and Render production have NOT been changed.'
          echo 'Review code: https://github.com/${{ github.repository }}/compare/main...fix/nota-ai-failover-20261118'
